app = 'veille-tech-dauvel'
primary_region = 'cdg'

[build]

[env]
  DB_PATH = '/data/veille.db'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[mounts]
  source = 'veille_data'
  destination = '/data'

[deploy]
  strategy = 'immediate'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1